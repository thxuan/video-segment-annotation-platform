services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run tools/prepare_demo.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run tools/prepare_demo.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/prepare_demo.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./src/backend
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_VIDEO_DIR: /app/storage/videos
      APP_FFPROBE_BINARY: ffprobe
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage/videos:/app/storage/videos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./src/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
