<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101012" />
    <meta name="description" content="视频片段标注工作区" />
    <title>视频片段标注平台</title>
    <script>
      // Apply the saved theme before styles and React load to avoid a dark flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("video-annotation-theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
