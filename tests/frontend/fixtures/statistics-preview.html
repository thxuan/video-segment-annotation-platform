<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="padding: 24px; background: #f6f8f5">
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
      import { Statistics } from "/src/Statistics.tsx";
      import { App } from "/src/App.tsx";
      import "/src/styles.css";
      const session = {
        user: { id: "mock-admin", role: "admin" },
        csrf_token: "mock-only",
      };
      const client = new QueryClient({
        defaultOptions: { queries: { retry: false } },
      });
      createRoot(document.getElementById("root")).render(
        React.createElement(
          QueryClientProvider,
          { client },
          new URLSearchParams(location.search).has("app")
            ? React.createElement(App)
            : React.createElement(Statistics, {
                session,
                onSelect: (id) => {
                  window.selectedTask = id;
                },
                onExpired: () => {
                  window.expired = true;
                },
              }),
        ),
      );
    </script>
  </body>
</html>
